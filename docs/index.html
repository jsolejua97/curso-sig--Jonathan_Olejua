
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veredas de Boyacá | Mapa SIG</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f3;
    }

    header {
      background: #245c43;
      color: white;
      padding: 16px 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 23px;
    }

    header p {
      margin: 0;
      font-size: 14px;
    }

    #estado {
      padding: 10px 16px;
      background: white;
      font-size: 14px;
    }

    #mapa {
      width: 100%;
      height: calc(100vh - 112px);
      min-height: 400px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Veredas de Boyacá</h1>
    <p>Visualizador geográfico de límites veredales</p>
  </header>

  <div id="estado">Inicializando mapa...</div>
  <div id="mapa"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const estado = document.getElementById("estado");

    // 1. Crear el mapa de Leaflet
    const mapa = L.map("mapa").setView([5.54, -73.36], 8);

    // 2. Mapa base de Esri: no requiere que generes una API key
    // para este servicio público de mapas.
    const mapaBase = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
      {
        attribution:
          "Tiles &copy; Esri — Sources: Esri, HERE, Garmin, " +
          "OpenStreetMap contributors, and the GIS user community",
        maxZoom: 19
      }
    ).addTo(mapa);

    mapaBase.on("tileerror", function () {
      estado.textContent =
        "El mapa base no pudo cargar algunas imágenes. " +
        "Verifica tu conexión o las restricciones de acceso.";
    });

    // 3. Servicio de polígonos de veredas de Boyacá
    const baseUrl =
      "https://services6.arcgis.com/Ex2fmFOuTOHRZtML/ArcGIS/rest/services/" +
      "Veredas_Boyaca_2024/FeatureServer/0/query";

    // 4. Parámetros de consulta
    const parametros = new URLSearchParams({
      where: "1=1",
      outFields: "*",
      returnGeometry: "true",
      outSR: "4326",
      f: "geojson",
      resultRecordCount: "2000"
    });

    const url = baseUrl + "?" + parametros.toString();

    // 5. Consultar las veredas
    fetch(url)
      .then(async function (respuesta) {
        if (!respuesta.ok) {
          throw new Error("HTTP " + respuesta.status);
        }

        return await respuesta.json();
      })
      .then(function (datos) {
        if (datos.error) {
          throw new Error(
            datos.error.message || "Error del servicio ArcGIS"
          );
        }

        if (!datos.features || datos.features.length === 0) {
          estado.textContent = "La consulta no devolvió veredas.";
          return;
        }

        // 6. Dibujar los polígonos
        const capaVeredas = L.geoJSON(datos, {
          style: function () {
            return {
              color: "#247447",
              weight: 1,
              fillColor: "#79bd87",
              fillOpacity: 0.35
            };
          },

          onEachFeature: function (feature, layer) {
            const p = feature.properties || {};

            const contenido =
              "<strong>Vereda:</strong> " +
              (p.NOMBRE_VER || "No disponible") +
              "<br><strong>Municipio:</strong> " +
              (p.NOMB_MPIO || "No disponible") +
              "<br><strong>Departamento:</strong> " +
              (p.NOM_DEP || "Boyacá") +
              (p.AREA_HA != null
                ? "<br><strong>Área (ha):</strong> " +
                  Number(p.AREA_HA).toLocaleString("es-CO")
                : "");

            layer.bindPopup(contenido);
          }
        }).addTo(mapa);

        // 7. Ajustar el mapa a los polígonos
        if (capaVeredas.getLayers().length > 0) {
          mapa.fitBounds(capaVeredas.getBounds());
        }

        estado.textContent =
          "Veredas cargadas: " + datos.features.length +
          (datos.features.length >= 2000
            ? ". La consulta puede tener más registros."
            : ".");
      })
      .catch(function (error) {
        console.error("Error al cargar las veredas:", error);
        estado.textContent =
          "Error al cargar las veredas: " + error.message;
      });
  </script>
</body>
</html>
